[project]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis — multi-agent stock research, backtesting and (gated) trading platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "redis>=5.0,<6",
    "celery>=5.4,<6",
    "pyjwt>=2.9,<3",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "exchange-calendars>=4.5,<5",
    "pandas>=2.2,<3",
    "feedparser>=6.0",
    "pypdf>=4.0",
    "pgvector>=0.3",
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
# NLP models (FinBERT sentiment, sentence embeddings). Without them the news
# agent reports sentiment as unavailable and document search is disabled.
# CPU torch: pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-redis",
    "ta>=0.11",  # independent indicator implementation used as a test oracle
    "pandas-stubs",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["celery.*", "exchange_calendars.*", "feedparser.*", "pgvector.*", "transformers.*", "sentence_transformers.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true
