<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Offline · Aegis</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f3; --panel:#fff; --ink:#0b0b0b; --muted:#52514e; --accent:#2a78d6; --line:#e1e0d9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --panel:#1a1a19; --ink:#f5f5f4; --muted:#c3c2b7; --accent:#3987e5; --line:#2c2c2a; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px; box-sizing:border-box; }
  .card { max-width:380px; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 24px; }
  h1 { font-size:20px; margin:16px 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.5; margin:0; }
  button { margin-top:20px; height:44px; padding:0 22px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 4.5 6.8v8.4c0 7.2 4.9 12.4 11.5 14.3 6.6-1.9 11.5-7.1 11.5-14.3V6.8L16 2.5Z" fill="#2a78d6"/><path d="m10.5 19.5 4-5.2 3 2.6 4.2-6.1" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>You're offline</h1>
    <p>Aegis needs a connection to show live research and paper-trading data. Nothing is shown from a stale copy, so you never act on old numbers.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
